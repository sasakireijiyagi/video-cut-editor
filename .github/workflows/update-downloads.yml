name: Update Download Count

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日UTC0時（日本時間9時）
  workflow_dispatch:       # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch download count
        run: |
          COUNT=$(python3 -c "
          import urllib.request, json, sys
          token = '${{ secrets.GITHUB_TOKEN }}'
          page, total = 1, 0
          while True:
              url = f'https://api.github.com/repos/sasakireijiyagi/video-cut-editor/releases?per_page=100&page={page}'
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r:
                  releases = json.load(r)
              if not releases:
                  break
              total += sum(a['download_count'] for r in releases for a in r.get('assets', []))
              page += 1
          print(total)
          ")
          echo "{\"total\": $COUNT}" > docs/downloads.json
          echo "Download count: $COUNT"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.json
          git diff --cached --quiet || git commit -m "Update download count [skip ci]"
          git push
