name: Build Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac-arm:
    runs-on: macos-latest  # Apple Silicon (M1/M2/M3)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # 版を固定する。固定していなかったため PyQt6 6.12 が勝手に入り，
        # Mac のビルドが COLLECT の段で落ちた（v1.2.15, 2026-11-17）。
        # 上げるときは手元で両OSのビルドを確かめてから。
        run: |
          pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8 PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.13.0 certifi

      - name: Run regression checks
        # 48項目の退行テスト。1つでも落ちたらビルドもリリースも作らない。
        # これが Windows 実機（GitHub のランナー）での検証を兼ねる
        run: python tests/run_checks.py

      - name: Build app
        run: |
          pyinstaller \
            --windowed \
            --name "EasyTranscribe" \
            --icon AppIcon.icns \
            --onedir \
            --collect-all PyQt6 \
            --add-data "fonts:fonts" \
            editor.py

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "おまかせ文字起こし" \
            --volicon AppIcon.icns \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "EasyTranscribe.app" 150 185 \
            --hide-extension "EasyTranscribe.app" \
            --app-drop-link 450 185 \
            "EasyTranscribe-Mac-AppleSilicon.dmg" \
            "dist/EasyTranscribe.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm-dmg
          path: EasyTranscribe-Mac-AppleSilicon.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # 版を固定する。固定していなかったため PyQt6 6.12 が勝手に入り，
        # Mac のビルドが COLLECT の段で落ちた（v1.2.15, 2026-11-17）。
        # 上げるときは手元で両OSのビルドを確かめてから。
        run: |
          pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8 PyQt6==6.11.0 PyQt6-Qt6==6.11.2 PyQt6-sip==13.13.0 certifi

      - name: Run regression checks
        # 48項目の退行テスト。1つでも落ちたらビルドもリリースも作らない。
        # これが Windows 実機（GitHub のランナー）での検証を兼ねる
        run: python tests/run_checks.py

      - name: Build exe
        run: |
          pyinstaller `
            --windowed `
            --name "EasyTranscribe" `
            --icon AppIcon.ico `
            --onedir `
            --collect-all PyQt6 `
            --add-data "fonts;fonts" `
            editor.py

      - name: Zip
        run: |
          Compress-Archive -Path dist\EasyTranscribe -DestinationPath EasyTranscribe-Windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: EasyTranscribe-Windows.zip

  release:
    needs: [build-mac-arm, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mac-arm artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-arm-dmg

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EasyTranscribe-Mac-AppleSilicon.dmg
            EasyTranscribe-Windows.zip
